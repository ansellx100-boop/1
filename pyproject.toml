[project]
name = "rostekhnadzor-agent"
version = "0.1.0"
description = "Autonomous research agent that tracks Rostekhnadzor updates"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cursor Agent" }]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "python-dateutil>=2.9"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
